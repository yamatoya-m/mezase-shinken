<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>わん！ダフル　めざせ神犬！</title>

<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;
  overscroll-behavior: none;

  font-family:
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background: #f6eadf;
}

body {
  touch-action: manipulation;
}

#screen {
  position: fixed;
  inset: 0;
  overflow: hidden;
}


/* =========================================================
   OPENING
========================================================= */

#opening-screen {
  position: fixed;
  inset: 0;

  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    rgba(255,255,255,0.16);

  backdrop-filter:
    blur(3px);

  transition:
    opacity 0.65s ease,
    visibility 0.65s ease;
}

#opening-screen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#opening-logo {
  width:
    min(94vw, 1450px);

  height: auto;

  animation:
    titleBoom
    0.9s
    ease-out;

  filter:
    drop-shadow(
      0 18px 22px
      rgba(0,0,0,0.18)
    );
}

@keyframes titleBoom {

  0% {
    transform:
      scale(0.22);

    opacity: 0;
  }

  55% {
    transform:
      scale(1.16);

    opacity: 1;
  }

  75% {
    transform:
      scale(1.05);
  }

  100% {
    transform:
      scale(1);
  }

}


/* =========================================================
   PC STAGE
========================================================= */

#stage {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 1600px;
  height: 900px;

  transform-origin:
    center center;

  opacity: 0;

  transition:
    opacity 0.5s ease;

  background:
    #f6eadf;

  overflow: hidden;
}

#stage.show {
  opacity: 1;
}


/* =========================================================
   BACKGROUND
========================================================= */

#stage-bg {
  position: absolute;

  inset: 0;

  background-image:
    url("images/背景.png");

  background-size:
    cover;

  background-position:
    center;

  background-repeat:
    no-repeat;

  opacity:
    0.50;

  z-index:
    0;
}

#stage-content {
  position: relative;

  width: 100%;
  height: 100%;

  z-index:
    2;
}


/* =========================================================
   LEFT UI
========================================================= */

#left-ui {
  position: absolute;

  left:
    70px;

  top:
    50px;

  width:
    350px;

  z-index:
    50;
}


/* =========================================================
   SCORE
========================================================= */

#score-area {
  position: relative;

  width:
    350px;

  margin-bottom:
    34px;
}

#score-image {
  display:
    block;

  width:
    100%;

  height:
    auto;

  pointer-events:
    none;

  user-select:
    none;
}

#score-number {
  position:
    absolute;

  left:
    50%;

  top:
    calc(58% + 10px);

  transform:
    translate(-50%, -50%);

  width:
    58%;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  color:
    #64340f;

  font-size:
    38px;

  line-height:
    1;

  font-weight:
    900;

  letter-spacing:
    2px;

  text-shadow:
    0 3px 0 #fff,
    2px 0 0 #fff,
    -2px 0 0 #fff,
    0 -2px 0 #fff;
}


/* =========================================================
   BUTTONS
========================================================= */

#button-area {
  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  gap:
    12px;
}

.game-button {
  width:
    280px;

  height:
    94px;

  padding:
    0;

  margin:
    0;

  border:
    none;

  background:
    transparent;

  cursor:
    pointer;

  touch-action:
    manipulation;

  transition:
    transform 0.10s ease,
    filter 0.10s ease;
}

.game-button img {
  display:
    block;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  pointer-events:
    none;

  user-select:
    none;
}

#start-button {
  width:
    315px;

  height:
    106px;

  margin-top:
    -6px;

  margin-bottom:
    -6px;
}

.game-button:hover {
  transform:
    scale(1.045);

  filter:
    brightness(1.05);
}

.game-button:active {
  transform:
    scale(0.95);
}


/* PCでは非表示 */

#evolution-button {
  display:
    none;
}


/* =========================================================
   GAME SECTION
========================================================= */

#game-section {
  position:
    absolute;

  left:
    50%;

  top:
    10px;

  transform:
    translateX(-50%);

  width:
    594px;

  height:
    890px;

  z-index:
    30;
}

#game-board {
  position:
    relative;

  width:
    594px;

  height:
    880px;

  margin:
    0 auto;
}


/* =========================================================
   FRAME
========================================================= */

#frame-image {
  position:
    absolute;

  left:
    0;

  top:
    0;

  width:
    594px;

  height:
    880px;

  object-fit:
    fill;

  pointer-events:
    none;

  user-select:
    none;

  z-index:
    2;
}


/* =========================================================
   PLAY AREA
========================================================= */

#play-area {
  position:
    absolute;

  left:
    68px;

  top:
    99px;

  width:
    458px;

  height:
    702px;

  overflow:
    hidden;

  border-radius:
    0 0 24px 24px;

  z-index:
    10;

  touch-action:
    none;

  user-select:
    none;

  -webkit-user-select:
    none;
}


/* =========================================================
   CANVAS
========================================================= */

#canvas-container {
  position:
    absolute;

  inset:
    0;

  z-index:
    10;
}

#canvas-container canvas {
  display:
    block;

  width:
    100% !important;

  height:
    100% !important;

  touch-action:
    none;
}


/* =========================================================
   CURRENT DOG
========================================================= */

#current-dog {
  position:
    absolute;

  left:
    50%;

  top:
    42px;

  transform:
    translateX(-50%);

  width:
    90px;

  height:
    90px;

  object-fit:
    contain;

  pointer-events:
    none;

  z-index:
    30;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(0,0,0,0.14)
    );
}


/* =========================================================
   DROP GUIDE
========================================================= */

#drop-guide {
  position:
    absolute;

  left:
    50%;

  top:
    11.538%;

  width:
    3px;

  height:
    8.12%;

  transform:
    translateX(-50%);

  border-radius:
    10px;

  background:
    rgba(255,255,255,0.90);

  box-shadow:
    0 0 8px
    rgba(255,255,255,0.8);

  z-index:
    20;

  pointer-events:
    none;
}


/* =========================================================
   DANGER LINE
========================================================= */

#danger-line {
  position:
    absolute;

  left:
    8px;

  right:
    8px;

  top:
    1.994%;

  height:
    4px;

  border-radius:
    10px;

  background:
    rgba(255,45,45,0.72);

  box-shadow:
    0 0 7px
    rgba(255,50,50,0.42);

  z-index:
    35;

  pointer-events:
    none;
}


/* =========================================================
   EFFECT
========================================================= */

#effect-layer {
  position:
    absolute;

  inset:
    0;

  z-index:
    40;

  pointer-events:
    none;

  overflow:
    hidden;
}

.merge-star {
  position:
    absolute;

  width:
    22px;

  height:
    22px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    22px;

  line-height:
    1;

  transform:
    translate(-50%, -50%);

  animation:
    starBurst
    0.55s
    ease-out
    forwards;

  text-shadow:
    0 2px 3px
    rgba(120,70,0,0.25);
}

@keyframes starBurst {

  0% {
    opacity:
      1;

    transform:
      translate(-50%, -50%)
      scale(0.4);
  }

  45% {
    opacity:
      1;
  }

  100% {
    opacity:
      0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1.35)
      rotate(var(--rot));
  }

}


/* =========================================================
   MESSAGE
========================================================= */

#message-layer {
  position:
    absolute;

  inset:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  z-index:
    50;

  pointer-events:
    none;
}

#message-layer.hidden {
  display:
    none;
}

#message-text {
  min-width:
    260px;

  padding:
    20px 34px;

  border:
    5px solid #ffca28;

  border-radius:
    28px;

  background:
    rgba(255,255,255,0.96);

  color:
    #6a3510;

  font-size:
    28px;

  font-weight:
    900;

  line-height:
    1.5;

  text-align:
    center;

  box-shadow:
    0 7px 0
    rgba(80,40,10,0.17);
}


/* =========================================================
   RIGHT UI
========================================================= */

#right-ui {
  position:
    absolute;

  right:
    70px;

  top:
    35px;

  width:
    350px;

  z-index:
    50;
}


/* =========================================================
   NEXT
========================================================= */

#next-area {
  position:
    relative;

  width:
    300px;

  height:
    300px;

  margin:
    0 auto 12px;
}

#next-frame-pc {
  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  pointer-events:
    none;

  z-index:
    2;
}

#next-frame-mobile {
  display:
    none;
}

#next-dog {
  position:
    absolute;

  left:
    50%;

  top:
    54%;

  transform:
    translate(-50%, -50%);

  width:
    125px;

  height:
    125px;

  object-fit:
    contain;

  z-index:
    5;
}


/* =========================================================
   PC EVOLUTION
========================================================= */

#evolution-area {
  position:
    relative;

  width:
    385px;

  height:
    620px;

  margin:
    0 auto;

  display:
    flex;

  justify-content:
    center;

  align-items:
    flex-start;
}

#evolution-image-pc {
  display:
    block;

  width:
    362px;

  max-height:
    615px;

  object-fit:
    contain;

  pointer-events:
    none;

  user-select:
    none;
}

#mobile-evolution-screen {
  display:
    none;
}


/* =========================================================
   =========================================================
   MOBILE
   =========================================================
========================================================= */

@media (max-width: 768px) {


  #stage {
    left:
      0;

    top:
      0;

    width:
      100vw;

    height:
      100dvh;

    transform:
      none;
  }


  /* TITLE */

  #opening-logo {
    width:
      140vw;

    max-width:
      none;
  }


  /* =======================================================
     SCORE
  ======================================================= */

  #left-ui {
    left:
      5.5%;

    top:
      1.3%;

    width:
      50%;

    height:
      auto;
  }

  #score-area {
    width:
      100%;

    margin:
      0;
  }

  #score-number {
    font-size:
      clamp(
        18px,
        calc(6vw - 3px),
        26px
      );

    left:
      50%;

    top:
      61%;

    transform:
      translate(-50%, -50%);

    width:
      58%;

    letter-spacing:
      1px;
  }


  /* =======================================================
     NEXT
  ======================================================= */

  #right-ui {
    right:
      5.3%;

    top:
      1.6%;

    width:
      23%;

    height:
      auto;
  }

  #next-area {
    width:
      100%;

    height:
      auto;

    aspect-ratio:
      1 / 1.12;

    margin:
      0;
  }

  #next-frame-pc {
    display:
      none;
  }

  #next-frame-mobile {
    display:
      block;

    position:
      absolute;

    inset:
      0;

    width:
      100%;

    height:
      100%;

    object-fit:
      contain;

    pointer-events:
      none;

    z-index:
      2;
  }

  #next-dog {
    left:
      50%;

    top:
      61%;

    width:
      48%;

    height:
      48%;

    z-index:
      5;
  }


  /* =======================================================
     WOOD FRAME
     ★ここだけ50px上へ変更
  ======================================================= */

  #game-section {
    left:
      50%;

    top:
      18%;

    width:
      92%;

    height:
      calc(100dvh - 255px);

    transform:
      translateX(-50%);

    z-index:
      30;
  }

  #game-board {
    width:
      100%;

    height:
      100%;
  }

  #frame-image {
    width:
      100%;

    height:
      100%;
  }

  #play-area {
    left:
      11.45%;

    top:
      11.25%;

    width:
      77.1%;

    height:
      79.7%;

    border-radius:
      0 0 17px 17px;
  }

  #current-dog {
    top:
      4.8%;
  }

  #danger-line {
    left:
      5px;

    right:
      5px;

    height:
      3px;
  }


  /* =======================================================
     BOTTOM BUTTON AREA
  ======================================================= */

  #button-area {
    position:
      fixed;

    left:
      1%;

    right:
      1%;

    bottom:
      max(
        7px,
        env(safe-area-inset-bottom)
      );

    width:
      98%;

    height:
      68px;

    display:
      grid;

    grid-template-columns:
      1.17fr
      1fr
      1fr
      1.05fr;

    align-items:
      center;

    gap:
      1px;

    z-index:
      300;
  }


  /* =======================================================
     START / STOP / RETRY
  ======================================================= */

  .game-button {
    margin:
      0;

    justify-self:
      center;
  }


  #start-button {
    position:
      relative;

    top:
      -6px;

    width:
      131.1%;

    height:
      71.3px;

    margin:
      0;

    justify-self:
      center;

    z-index:
      3;
  }


  #stop-button {
    width:
      117.3%;

    height:
      66.7px;

    z-index:
      3;
  }


  #retry-button {
    width:
      118.45%;

    height:
      66.7px;

    z-index:
      3;
  }


  #evolution-button {
    display:
      block;

    grid-column:
      4;

    width:
      104%;

    height:
      58px;

    padding:
      0;

    margin:
      0;

    border:
      0;

    background:
      transparent;

    cursor:
      pointer;

    justify-self:
      center;

    z-index:
      2;
  }

  #evolution-button img {
    display:
      block;

    width:
      100%;

    height:
      100%;

    object-fit:
      contain;

    pointer-events:
      none;
  }


  .game-button:hover {
    transform:
      none;

    filter:
      none;
  }

  .game-button:active,
  #evolution-button:active {
    transform:
      scale(0.95);
  }


  /* =======================================================
     PC EVOLUTION HIDE
  ======================================================= */

  #evolution-area {
    display:
      none;
  }


  /* =======================================================
     MESSAGE
  ======================================================= */

  #message-text {
    min-width:
      180px;

    padding:
      12px 18px;

    border-width:
      4px;

    border-radius:
      20px;

    font-size:
      19px;
  }


  /* =======================================================
     EVOLUTION PAGE
  ======================================================= */

  #mobile-evolution-screen {
    display:
      none;

    position:
      fixed;

    inset:
      0;

    z-index:
      5000;

    overflow:
      hidden;

    background:
      linear-gradient(
        180deg,
        rgba(255,213,145,0.20) 0%,
        rgba(255,244,221,0.20) 50%,
        rgba(255,191,112,0.20) 100%
      );
  }

  #mobile-evolution-screen.show {
    display:
      block;
  }

  #evolution-page-inner {
    position:
      absolute;

    inset:
      0;

    display:
      flex;

    flex-direction:
      column;

    align-items:
      center;

    overflow:
      hidden;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,0.72) 0%,
        rgba(255,248,231,0.76) 100%
      );
  }


  /* PAWS */

  .evo-paw {
    position:
      absolute;

    color:
      rgba(210,137,56,0.15);

    font-size:
      54px;

    line-height:
      1;

    pointer-events:
      none;

    user-select:
      none;

    z-index:
      0;
  }

  .evo-paw.paw1 {
    left:
      5%;

    top:
      14%;

    transform:
      rotate(-22deg);
  }

  .evo-paw.paw2 {
    right:
      3%;

    top:
      27%;

    font-size:
      66px;

    transform:
      rotate(20deg);
  }

  .evo-paw.paw3 {
    left:
      7%;

    bottom:
      17%;

    font-size:
      68px;

    transform:
      rotate(15deg);
  }

  .evo-paw.paw4 {
    right:
      8%;

    bottom:
      8%;

    font-size:
      48px;

    transform:
      rotate(-18deg);
  }

  .evo-paw.paw5 {
    left:
      42%;

    top:
      42%;

    font-size:
      42px;

    color:
      rgba(210,137,56,0.09);

    transform:
      rotate(8deg);
  }


  /* CLOSE */

  #evolution-close {
    position:
      absolute;

    top:
      calc(
        env(safe-area-inset-top)
        +
        16px
      );

    right:
      15px;

    width:
      44px;

    height:
      44px;

    border:
      3px solid #b17739;

    border-radius:
      50%;

    background:
      #fff8e8;

    color:
      #784317;

    font-size:
      31px;

    font-weight:
      bold;

    line-height:
      34px;

    cursor:
      pointer;

    z-index:
      10;
  }


  /* TITLE */

  #evolution-page-title {
    position:
      relative;

    z-index:
      2;

    width:
      57%;

    height:
      auto;

    margin-top:
      calc(
        env(safe-area-inset-top)
        +
        42px
      );

    object-fit:
      contain;
  }


  /* CIRCLE */

  #evolution-circle {
    position:
      relative;

    z-index:
      2;

    width:
      76%;

    height:
      auto;

    margin-top:
      20px;

    object-fit:
      contain;

    filter:
      drop-shadow(
        0 5px 8px
        rgba(120,80,30,0.08)
      );
  }


  /* DESCRIPTION */

  #evolution-description {
    position:
      relative;

    z-index:
      2;

    margin-top:
      calc(7vh - 10px);

    width:
      88%;

    padding:
      14px 15px;

    text-align:
      center;

    color:
      #4c321d;

    font-size:
      clamp(
        15px,
        4vw,
        19px
      );

    font-weight:
      700;

    line-height:
      1.7;

    letter-spacing:
      0.03em;

    background:
      rgba(255,255,255,0.48);

    border:
      1px solid
      rgba(207,139,58,0.18);

    border-radius:
      20px;

    box-shadow:
      0 5px 16px
      rgba(130,80,20,0.05);
  }

  #evolution-description strong {
    color:
      #d37b00;

    font-size:
      1.08em;
  }

}

</style>
</head>


<body>

<div id="screen">


<audio
  id="bgm"
  src="sounds/bgm.mp3"
  loop
  preload="auto"
></audio>


<!-- OPENING -->

<div id="opening-screen">

  <img
    id="opening-logo"
    src="images/TITLE.png"
    alt="わん！ダフル めざせ神犬！"
  >

</div>


<!-- GAME -->

<div id="stage">


<div id="stage-bg"></div>


<div id="stage-content">


<!-- LEFT -->

<div id="left-ui">


<div id="score-area">

  <img
    id="score-image"
    src="images/SCORE.png"
    alt="SCORE"
  >

  <div id="score-number">
    0
  </div>

</div>


<div id="button-area">


<button
  id="start-button"
  class="game-button"
>
  <img
    src="images/START.png"
    alt="START"
  >
</button>


<button
  id="stop-button"
  class="game-button"
>
  <img
    src="images/STOP.png"
    alt="STOP"
  >
</button>


<button
  id="retry-button"
  class="game-button"
>
  <img
    src="images/RETRY.png"
    alt="RETRY"
  >
</button>

/* =========================================================
   AUDIO
========================================================= */

function getAudioContext() {

  if (!audioContext) {

    audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }


  return audioContext;

}


function createKyupeen(
  ctx,
  startTime
) {

  const osc1 =
  ctx.createOscillator();

  const gain1 =
  ctx.createGain();


  osc1.type =
  "sine";


  osc1.frequency.setValueAtTime(
    650,
    startTime
  );


  osc1.frequency.exponentialRampToValueAtTime(
    2100,
    startTime + 0.34
  );


  gain1.gain.setValueAtTime(
    0.0001,
    startTime
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.12,
    startTime + 0.04
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + 0.48
  );


  osc1.connect(
    gain1
  );

  gain1.connect(
    ctx.destination
  );


  osc1.start(
    startTime
  );


  osc1.stop(
    startTime + 0.50
  );


  const osc2 =
  ctx.createOscillator();

  const gain2 =
  ctx.createGain();


  osc2.type =
  "sine";


  osc2.frequency.setValueAtTime(
    2600,
    startTime + 0.26
  );


  osc2.frequency.exponentialRampToValueAtTime(
    3800,
    startTime + 0.42
  );


  gain2.gain.setValueAtTime(
    0.0001,
    startTime + 0.26
  );


  gain2.gain.exponentialRampToValueAtTime(
    0.07,
    startTime + 0.29
  );


  gain2.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + 0.55
  );


  osc2.connect(
    gain2
  );

  gain2.connect(
    ctx.destination
  );


  osc2.start(
    startTime + 0.26
  );


  osc2.stop(
    startTime + 0.56
  );

}


function playTitleSound() {

  if (
    titleSoundPlayed
  ) {

    return;

  }


  try {

    const ctx =
    getAudioContext();


    createKyupeen(
      ctx,
      ctx.currentTime + 0.05
    );


    titleSoundPlayed =
    true;

  }

  catch(error) {}

}


function playButtonSound() {

  try {

    const ctx =
    getAudioContext();


    const now =
    ctx.currentTime;


    const osc =
    ctx.createOscillator();


    const gain =
    ctx.createGain();


    osc.type =
    "sine";


    osc.frequency.setValueAtTime(
      500,
      now
    );


    osc.frequency.exponentialRampToValueAtTime(
      300,
      now + 0.09
    );


    gain.gain.setValueAtTime(
      0.0001,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.16,
      now + 0.008
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.11
    );


    osc.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );


    osc.start(
      now
    );


    osc.stop(
      now + 0.12
    );

  }

  catch(error) {}

}


function playMergeSound() {

  try {

    const ctx =

    const now =
    ctx.currentTime;


    const oscillator1 =
    ctx.createOscillator();

    );

}


/* =========================================================
   BGM

async function startBGM() {

  if (

  ) {

    return;

  try {

    await bgm.play();

function unlockAudio() {

  try {

    getAudioContext();

  }

  catch(error) {}


  if (
    gameStarted &&
    !gamePaused &&
    !gameOver
  ) {

    startBGM();

  }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeStage() {

  const mobile =
  window.innerWidth <= 768;


  if (mobile) {

    stage.style.left =
    "0px";


    stage.style.top =
    "0px";


    stage.style.width =
    "100vw";


    stage.style.height =
    "100dvh";


    stage.style.transform =
    "none";

  }

  else {

    const scale =
    Math.min(
      window.innerWidth / 1600,
      window.innerHeight / 900
    );


    stage.style.width =
    "1600px";


    stage.style.height =
    "900px";


    stage.style.left =
    "50%";


    stage.style.top =
    "50%";


    stage.style.transform =
    `
      translate(-50%, -50%)
      scale(${scale})
    `;

  }


  requestAnimationFrame(
    () => {

      updateQueueDisplay();

      syncDropUI();

    }
  );

}


window.addEventListener(
  "resize",
  resizeStage
);


/* =========================================================
   PRELOAD
========================================================= */

function preloadDogImages() {

  return Promise.all(

    DOG_DATA.map(

      dog =>

      new Promise(

        resolve => {

          const image =
          new Image();


          image.src =
          dog.image;


          image.onload =
          () => {

            imageSizes[
              dog.level
            ] = {

              width:
              image.naturalWidth,

              height:
              image.naturalHeight

            };


            resolve();

          };


          image.onerror =
          () => {

            imageSizes[
              dog.level
            ] = {

              width:
              512,

              height:
              512

            };


            resolve();

          };

        }

      )

    )

  );

}


/* =========================================================
   PHYSICS
========================================================= */

function createPhysicsWorld() {

  engine =
  Engine.create();


  engine.gravity.y =
  1.05;


  render =
  Render.create({

    element:
    canvasContainer,

    engine:
    engine,

    options: {

      width:
      GAME_WIDTH,

      height:
      GAME_HEIGHT,

      wireframes:
      false,

      background:
      "transparent",

      pixelRatio:
      window.devicePixelRatio || 1

    }

  });


  Render.run(
    render
  );


  runner =
  Runner.create();


  Runner.run(
    runner,
    engine
  );


  createWalls();

  setupCollision();

}


/* =========================================================
   WALLS
========================================================= */

function createWalls() {

  const thickness =
  60;


  const sideInset =
  16;


  const floorInset =
  14;


  const leftWall =
  Bodies.rectangle(

    -thickness / 2 +
    sideInset,

    GAME_HEIGHT / 2,

    thickness,

    GAME_HEIGHT,

    {

      isStatic:
      true,

      restitution:
      0.05,

      friction:
      0.45,

      render: {

        visible:
        false

      }

    }

  );


  const rightWall =
  Bodies.rectangle(

    GAME_WIDTH +
    thickness / 2 -
    sideInset,

    GAME_HEIGHT / 2,

    thickness,

    GAME_HEIGHT,

    {

      isStatic:
      true,

      restitution:
      0.05,

      friction:
      0.45,

      render: {

        visible:
        false

      }

    }

  );


  const floor =
  Bodies.rectangle(

    GAME_WIDTH / 2,

    GAME_HEIGHT +
    thickness / 2 -
    floorInset,

    GAME_WIDTH,

    thickness,

    {

      isStatic:
      true,

      restitution:
      0.04,

      friction:
      0.75,

      render: {

        visible:
        false

      }

    }

  );


  Composite.add(
    engine.world,
    [
      leftWall,
      rightWall,
      floor
    ]
  );

}


/* =========================================================
   CREATE DOG
========================================================= */

function createDog(
  x,
  y,
  level
) {

  const data =
  DOG_DATA[
    level - 1
  ];


  const radius =
  data.collisionDiameter / 2;


  const dog =
  Bodies.circle(

    x,

    y,

    radius,

    {

      label:
      "dog",

      restitution:
      0.13,

      friction:
      0.22,

      frictionStatic:
      0.42,

      frictionAir:
      0.006,

      density:
      0.00125,

      render: {

        sprite: {

          texture:
          data.image,

          xScale:
          1,

          yScale:
          1

        }

      }

    }

  );


  dog.dogLevel =
  level;


  dog.isMerging =
  false;


  setSpriteScale(
    dog,
    level
  );


  return dog;

}


function setSpriteScale(
  body,
  level
) {

  const data =
  DOG_DATA[
    level - 1
  ];


  const info =
  imageSizes[
    level
  ];


  body.render.sprite.xScale =
  data.visualDiameter /
  info.width;


  body.render.sprite.yScale =
  data.visualDiameter /
  info.height;

}


/* =========================================================
   RANDOM
========================================================= */

function randomSpawnLevel() {

  const value =
  Math.random();


  if (
    value < 0.45
  ) {

    return 1;

  }


  if (
    value < 0.74
  ) {

    return 2;

  }


  if (
    value < 0.93
  ) {

    return 3;

  }


  return 4;

}


/* =========================================================
   QUEUE
========================================================= */

function createInitialQueue() {

  currentDogLevel =
  randomSpawnLevel();


  nextDogLevel =
  randomSpawnLevel();


  dropX =
  GAME_WIDTH / 2;


  updateQueueDisplay();

  syncDropUI();

}


function updateQueueDisplay() {

  currentDog.src =
  DOG_DATA[
    currentDogLevel - 1
  ].image;


  nextDog.src =
  DOG_DATA[
    nextDogLevel - 1
  ].image;


  const data =
  DOG_DATA[
    currentDogLevel - 1
  ];


  const baseSize =
  Math.max(

    74,

    Math.min(

      118,

      data.visualDiameter *
      1.15

    )

  );


  const boardScale =
  gameBoard.offsetWidth /
  594;


  const displaySize =
  baseSize *
  boardScale;


  currentDog.style.width =
  displaySize +
  "px";


  currentDog.style.height =
  displaySize +
  "px";

}


function advanceQueue() {

  currentDogLevel =
  nextDogLevel;


  nextDogLevel =
  randomSpawnLevel();


  updateQueueDisplay();

  syncDropUI();

}


/* =========================================================
   POSITION
========================================================= */

function syncDropUI() {

  const percent =
  (
    dropX /
    GAME_WIDTH
  ) * 100;


  dropGuide.style.left =
  percent +
  "%";


  const visibleX =
  (
    dropX /
    GAME_WIDTH
  )
  *
  playArea.offsetWidth;


  currentDog.style.left =
  (
    playArea.offsetLeft +
    visibleX
  )
  +
  "px";

}


/* =========================================================
   X POSITION
========================================================= */

function getGameX(
  clientX
) {

  const rect =
  playArea
  .getBoundingClientRect();


  return (
    clientX -
    rect.left
  )
  *
  (
    GAME_WIDTH /
    rect.width
  );

}


function updateDropPosition(
  clientX
) {

  if (
    !gameStarted ||
    gamePaused ||
    gameOver
  ) {

    return;

  }


  const data =
  DOG_DATA[
    currentDogLevel - 1
  ];


  const radius =
  data.collisionDiameter /
  2;


  const minX =
  radius +
  20;


  const maxX =
  GAME_WIDTH -
  radius -
  20;


  dropX =
  getGameX(
    clientX
  );


  dropX =
  Math.max(

    minX,

    Math.min(

      maxX,

      dropX

    )

  );


  syncDropUI();

}


/* =========================================================
   DROP
========================================================= */

function dropDog() {

  if (
    !gameStarted ||
    gamePaused ||
    gameOver ||
    !canDrop
  ) {

    return;

  }


  canDrop =
  false;


  const data =
  DOG_DATA[
    currentDogLevel - 1
  ];


  const radius =
  data.collisionDiameter /
  2;


  const minX =
  radius +
  20;


  const maxX =
  GAME_WIDTH -
  radius -
  20;


  const safeX =
  Math.max(

    minX,

    Math.min(

      maxX,

      dropX

    )

  );


  const dog =
  createDog(

    safeX,

    34,

    currentDogLevel

  );


  Composite.add(
    engine.world,
    dog
  );


  advanceQueue();


  setTimeout(

    () => {

      if (
        !gamePaused &&
        !gameOver
      ) {

        canDrop =
        true;

      }

    },

    430

  );

}


/* =========================================================
   PC INPUT
========================================================= */

playArea.addEventListener(

  "mousemove",

  event => {

    if (
      window.innerWidth > 768
    ) {

      updateDropPosition(
        event.clientX
      );

    }

  }

);


playArea.addEventListener(

  "click",

  event => {

    if (
      window.innerWidth <= 768
    ) {

      return;

    }


    unlockAudio();


    updateDropPosition(
      event.clientX
    );


    dropDog();

  }

);


/* =========================================================
   MOBILE INPUT
========================================================= */

gameBoard.addEventListener(

  "touchstart",

  event => {

    if (
      window.innerWidth > 768
    ) {

      return;

    }


    if (
      event.touches.length !== 1
    ) {

      return;

    }


    event.preventDefault();


    unlockAudio();


    mobileTouching =
    true;


    updateDropPosition(
      event.touches[0].clientX
    );

  },

  {
    passive:
    false
  }

);


gameBoard.addEventListener(

  "touchmove",

  event => {

    if (
      window.innerWidth > 768
    ) {

      return;

    }


    if (
      !mobileTouching
    ) {

      return;

    }


    if (
      event.touches.length !== 1
    ) {

      return;

    }


    event.preventDefault();


    updateDropPosition(
      event.touches[0].clientX
    );

  },

  {
    passive:
    false
  }

);


gameBoard.addEventListener(

  "touchend",

  event => {

    if (
      window.innerWidth > 768
    ) {

      return;

    }


    if (
      !mobileTouching
    ) {

      return;

    }


    event.preventDefault();


    if (
      event.changedTouches.length
    ) {

      updateDropPosition(
        event.changedTouches[0].clientX
      );

    }


    dropDog();


    mobileTouching =
    false;

  },

  {
    passive:
    false
  }

);


gameBoard.addEventListener(

  "touchcancel",

  () => {

    mobileTouching =
    false;

  }

);


/* =========================================================
   COLLISION
========================================================= */

function setupCollision() {

  Events.on(

    engine,

    "collisionStart",

    event => {


      event.pairs.forEach(

        pair => {


          const a =
          pair.bodyA;


          const b =
          pair.bodyB;


          if (
            a.label !== "dog" ||
            b.label !== "dog"
          ) {

            return;

          }


          if (
            a.dogLevel !==
            b.dogLevel
          ) {

            return;

          }


          if (
            a.isMerging ||
            b.isMerging
          ) {

            return;

          }


          if (
            mergeLock.has(a.id) ||
            mergeLock.has(b.id)
          ) {

            return;

          }


          if (
            a.dogLevel === 10 &&
            b.dogLevel === 10
          ) {

            removeGodDogs(
              a,
              b
            );


            return;

          }


          mergeDogs(
            a,
            b
          );

        }

      );

    }

  );

}


/* =========================================================
   GOD DOG
========================================================= */

function removeGodDogs(
  a,
  b
) {

  a.isMerging =
  true;


  b.isMerging =
  true;


  mergeLock.add(
    a.id
  );


  mergeLock.add(
    b.id
  );


  const x =
  (
    a.position.x +
    b.position.x
  ) / 2;


  const y =
  (
    a.position.y +
    b.position.y
  ) / 2;


  Composite.remove(
    engine.world,
    a
  );


  Composite.remove(
    engine.world,
    b
  );


  playMergeSound();


  createStarBurst(
    x,
    y
  );


  setTimeout(

    () => {

      mergeLock.delete(
        a.id
      );


      mergeLock.delete(
        b.id
      );

    },

    100

  );

}


/* =========================================================
   MERGE
========================================================= */

function mergeDogs(
  a,
  b
) {

  a.isMerging =
  true;


  b.isMerging =
  true;


  mergeLock.add(
    a.id
  );


  mergeLock.add(
    b.id
  );


  const nextLevel =
  a.dogLevel +
  1;


  const newX =
  (
    a.position.x +
    b.position.x
  ) / 2;


  const newY =
  (
    a.position.y +
    b.position.y
  ) / 2;


  Composite.remove(
    engine.world,
    a
  );


  Composite.remove(
    engine.world,
    b
  );


  playMergeSound();


  createStarBurst(
    newX,
    newY
  );


  const newDog =
  createDog(
    newX,
    newY,
    nextLevel
  );


  Body.setVelocity(

    newDog,

    {

      x:
      (
        Math.random() -
        0.5
      )
      *
      1.35,

      y:
      -1.5

    }

  );


  Composite.add(
    engine.world,
    newDog
  );


  score +=
  DOG_DATA[
    nextLevel - 1
  ].score;


  updateScore();


  setTimeout(

    () => {

      mergeLock.delete(
        a.id
      );


      mergeLock.delete(
        b.id
      );

    },

    100

  );

}


/* =========================================================
   STAR
========================================================= */

function createStarBurst(
  x,
  y
) {

  const symbols =
  [
    "★",
    "✦",
    "★",
    "✧"
  ];


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const star =
    document.createElement(
      "div"
    );


    star.className =
    "merge-star";


    star.textContent =
    symbols[
      Math.floor(
        Math.random() *
        symbols.length
      )
    ];


    const angle =
    (
      Math.PI *
      2 *
      i
    ) / 8;


    const distance =
    34 +
    Math.random() *
    34;


    const dx =
    Math.cos(angle) *
    distance;


    const dy =
    Math.sin(angle) *
    distance;


    star.style.left =
    x +
    "px";


    star.style.top =
    y +
    "px";


    star.style.setProperty(
      "--dx",
      dx + "px"
    );


    star.style.setProperty(
      "--dy",
      dy + "px"
    );


    star.style.setProperty(
      "--rot",
      (
        Math.random() *
        160 -
        80
      )
      +
      "deg"
    );


    const colors =
    [
      "#ffd52a",
      "#ff9f1a",
      "#fff3a6",
      "#ffffff"
    ];


    star.style.color =
    colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];


    effectLayer.appendChild(
      star
    );


    setTimeout(

      () => {

        star.remove();

      },

      600

    );

  }

}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

  scoreNumber.textContent =
  score.toLocaleString();

}


/* =========================================================
   START
========================================================= */

function startGame() {

  unlockAudio();


  if (
    gameOver
  ) {

    return;

  }


  if (
    gamePaused
  ) {

    resumeGame();

    return;

  }


  if (
    gameStarted
  ) {

    startBGM();

    return;

  }


  gameStarted =
  true;


  gamePaused =
  false;


  gameOver =
  false;


  canDrop =
  true;


  if (
    runner
  ) {

    runner.enabled =
    true;

  }


  createInitialQueue();


  hideMessage();


  startBGM();

}


/* =========================================================
   STOP
========================================================= */

function pauseGame() {

  if (
    !gameStarted ||
    gameOver
  ) {

    return;

  }


  gamePaused =
  true;


  canDrop =
  false;


  if (
    runner
  ) {

    runner.enabled =
    false;

  }


  engine.timing.timeScale =
  0;


  bgm.pause();


  showMessage(
    "PAUSE"
  );

}


/* =========================================================
   RESUME
========================================================= */

function resumeGame() {

  gamePaused =
  false;


  canDrop =
  true;


  engine.timing.timeScale =
  1;


  if (
    runner
  ) {

    runner.enabled =
    true;

  }


  hideMessage();


  startBGM();

}


/* =========================================================
   RETRY
========================================================= */

function resetGame() {

  unlockAudio();


  Composite
  .allBodies(
    engine.world
  )
  .forEach(

    body => {

      if (
        body.label ===
        "dog"
      ) {

        Composite.remove(
          engine.world,
          body
        );

      }

    }

  );


  score =
  0;


  updateScore();


  dangerStartTime =
  null;


  gameStarted =
  true;


  gamePaused =
  false;


  gameOver =
  false;


  canDrop =
  true;


  engine.timing.timeScale =
  1;


  if (
    runner
  ) {

    runner.enabled =
    true;

  }


  createInitialQueue();


  hideMessage();


  startBGM();

}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver() {

  if (
    !gameStarted ||
    gamePaused ||
    gameOver
  ) {

    dangerStartTime =
    null;


    return;

  }


  const dogs =
  Composite
  .allBodies(
    engine.world
  )
  .filter(

    body =>
    body.label ===
    "dog"

  );


  const dangerous =
  dogs.find(

    dog =>

    dog.position.y -
    dog.circleRadius
    <
    GAME_OVER_LINE_Y

    &&

    Math.abs(
      dog.velocity.y
    )
    <
    0.35

  );


  if (
    dangerous
  ) {

    if (
      dangerStartTime ===
      null
    ) {

      dangerStartTime =
      performance.now();

    }


    if (
      performance.now() -
      dangerStartTime
      >
      1500
    ) {

      finishGame();

    }

  }

  else {

    dangerStartTime =
    null;

  }

}


function finishGame() {

  gameOver =
  true;


  canDrop =
  false;


  engine.timing.timeScale =
  0;


  if (
    runner
  ) {

    runner.enabled =
    false;

  }


  bgm.pause();


  showMessage(

    "GAME OVER"
    +
    "<br>"
    +
    "SCORE "
    +
    score.toLocaleString()

  );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text
) {

  messageText.innerHTML =
  text;


  messageLayer
  .classList
  .remove(
    "hidden"
  );

}


function hideMessage() {

  messageLayer
  .classList
  .add(
    "hidden"
  );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(

  "click",

  () => {

    playButtonSound();


    startGame();

  }

);


stopButton.addEventListener(

  "click",

  () => {

    playButtonSound();


    pauseGame();

  }

);


retryButton.addEventListener(

  "click",

  () => {

    playButtonSound();


    resetGame();

  }

);


/* =========================================================
   EVOLUTION SCREEN
========================================================= */

evolutionButton.addEventListener(

  "click",

  () => {

    playButtonSound();


    evolutionScreen
    .classList
    .add(
      "show"
    );

  }

);


evolutionClose.addEventListener(

  "click",

  () => {

    playButtonSound();


    evolutionScreen
    .classList
    .remove(
      "show"
    );

  }

);


/* =========================================================
   LOOP
========================================================= */

function gameLoop() {

  checkGameOver();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   BOOT
========================================================= */

async function bootGame() {

  await preloadDogImages();


  createPhysicsWorld();


  updateScore();


  resizeStage();


  gameLoop();


  setTimeout(

    () => {

      playTitleSound();

    },

    220

  );


  setTimeout(

    () => {

      openingScreen
      .classList
      .add(
        "hide"
      );


      stage
      .classList
      .add(
        "show"
      );


      resizeStage();


      setTimeout(

        () => {

          startGame();

        },

        450

      );

    },

    3000

  );

}


bootGame();

</script>
